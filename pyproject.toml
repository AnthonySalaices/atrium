[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glasshouse"
version = "0.1.0"
description = "Floating terminal windows for your coding agents in a VR headset — the host side."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["lupa>=2.0"]
keywords = ["vr", "terminal", "tmux", "openxr", "quest"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/AnthonySalaices/glasshouse"

[project.scripts]
glasshouse = "glassd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["glassd"]

# The Lua config files live at the repo root for humans; ship them inside the
# package so an installed daemon finds them next to config.py.
[tool.hatch.build.targets.wheel.force-include]
"config/default.lua" = "glassd/config/default.lua"
"config/xr.lua" = "glassd/config/xr.lua"
"config/eval.lua" = "glassd/config/eval.lua"
"config/starter.lua" = "glassd/config/starter.lua"

[tool.hatch.build.targets.sdist]
include = ["glassd", "config", "README.md", "LICENSE", "pyproject.toml"]
